name: Energiedata bijwerken

on:
  schedule:
    - cron: "30 5 * * 1-6"   # ma–za 05:30 UTC (06:30/07:30 NL)
  workflow_dispatch: {}       # handmatig starten via het tabblad Actions
  push:
    paths: ["data/manual/**"] # opnieuw bouwen als je een handmatig bestand bijwerkt

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.build
      - name: Wijzigingen vastleggen
        run: |
          if git diff --quiet -- public/data; then
            echo "Geen wijzigingen."
          else
            git config user.name "energiewijzer-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data
            git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
            git push
          fi
